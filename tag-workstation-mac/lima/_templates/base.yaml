minimumLimaVersion: 2.2.0

base:
- template:_images/fedora-44

vmType: vz
mountType: virtiofs
cpus: 2
memory: 12GiB

# Set up a plain user instead of default Lima convention (as we don't want tight host integration)
user:
  name: dev
  comment: Dev
  home: /home/dev
  shell: /usr/bin/fish

mounts:
- location: "{{.Home}}/src/csutter/setup"
  mountPoint: /mnt/setup
- location: "{{.Home}}/src/csutter/setup-private"
  mountPoint: /mnt/setup-private

provision:
  # Install packages
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      dnf update -y
      dnf install -y \
        autoconf automake bison cmake flex gcc gcc-c++ gdb gettext libtool make \
        meson ninja-build patch strace \
        git info less man-pages bzip2 diffutils fish ripgrep rcm tree which zip

  # Apply dotfiles
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      RCRC=/mnt/setup/tag-dev-vm/rcrc rcup -vf

  # Install or update aqua
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail

      INSTALLER_VERSION=v4.1.0
      INSTALLER_SHA256=4d3e513d42f425609c1ead6ecd40b9c62492011979dfe23d7012428a59efbe82

      export PATH="$HOME/.local/share/aquaproj-aqua/bin:$PATH"

      if command -v aqua >/dev/null 2>&1; then
        aqua update-aqua
      else
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT

        curl -sSfL -o "$tmp/aqua-installer" \
          "https://raw.githubusercontent.com/aquaproj/aqua-installer/${INSTALLER_VERSION}/aqua-installer"
        echo "${INSTALLER_SHA256}  $tmp/aqua-installer" | sha256sum -c -
        chmod +x "$tmp/aqua-installer"

        "$tmp/aqua-installer"
      fi

  # Install global aqua tools
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail

      export AQUA_GLOBAL_CONFIG="$HOME/.config/aqua/aqua.yaml"
      aqua install -a

probes:
- mode: readiness
  description: rcm dotfiles set up
  script: |
    #!/bin/bash
    set -eux -o pipefail
    if ! timeout 60s bash -c 'until [ -e "$HOME/.rcrc" ]; do sleep 2; done'; then
      echo >&2 "~/.rcrc does not exist"
      exit 1
    fi
  hint: |
    No ~/.rcrc found (try looking at /var/log/cloud-init-output.log in the guest)
- mode: readiness
  description: tool installation complete
  script: |
    #!/bin/bash
    set -eux -o pipefail
    # gh should always be present as it's in my global aqua configuration
    if ! timeout 60s bash -c 'until command -v gh >/dev/null 2>&1; do sleep 2; done'; then
      echo >&2 "gh is not installed"
      exit 1
    fi
  hint: |
    gh not found, assuming tool installation failed (try looking at /var/log/cloud-init-output.log
    in the guest)
